# The URL the site will be built for
base_url = "https://bdarnell.com"

title = "bdarnell.com"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

[markdown]
# Raw HTML in markdown (e.g. the <img> on the About page) is rendered by default.

[markdown.highlighting]
theme = "catppuccin-mocha"

[extra]

# --- Main-site nav (the subtle top bar in the Strata main column) ---
[[extra.nav]]
name = "About"
link = "/"

[[extra.nav]]
name = "Projects"
link = "/projects/"

# --- Legacy site navigation (was Jekyll _data/navigation.yml) ---
[[extra.navigation]]
name = "About"
link = "/legacy/about/"

[[extra.navigation]]
name = "Projects"
link = "/legacy/projects/"

[[extra.navigation]]
name = "Pi"
link = "http://ben1152000.duckdns.org:8000/"

[[extra.navigation]]
name = "Github"
link = "https://github.com/Ben1152000"

# --- Projects: moved to content/projects.md [extra] (page-specific content). ---

# --- Profile / identity (drives the Strata header + footer) ---
